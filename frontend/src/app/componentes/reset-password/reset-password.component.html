<section class="auth-card"><h1>Nueva contraseña</h1><p>Pega el código del correo y elige una contraseña nueva. El código solo puede usarse una vez.</p><form [formGroup]="form" (ngSubmit)="enviar()" novalidate><label for="token">Código de recuperación</label><input id="token" type="text" formControlName="token" autocomplete="off" aria-describedby="token-error"><small id="token-error" *ngIf="form.controls.token.touched && form.controls.token.invalid">Introduce el código completo recibido por correo.</small><label for="password">Nueva contraseña</label><input id="password" type="password" formControlName="password" autocomplete="new-password" aria-describedby="password-error"><small id="password-error" *ngIf="form.controls.password.touched && form.controls.password.invalid">Usa entre 8 y 64 caracteres, máximo 72 bytes.</small><p role="status" *ngIf="message()">{{ message() }}</p><p role="alert" *ngIf="error()">{{ error() }}</p><button [disabled]="busy()">{{ busy() ? "Procesando…" : "Actualizar contraseña" }}</button></form><p><a routerLink="/login">Volver a iniciar sesión</a></p></section>
