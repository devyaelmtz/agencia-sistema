<section class="auth-card"><h1>Recuperar contraseña</h1><p>Te enviaremos instrucciones si tu correo está registrado.</p><form [formGroup]="form" (ngSubmit)="enviar()" novalidate><label for="correo">Correo electrónico</label><input id="correo" type="email" formControlName="correo" autocomplete="email" aria-describedby="correo-error"><small id="correo-error" *ngIf="form.controls.correo.touched && form.controls.correo.invalid">Introduce un correo válido.</small><p role="status" *ngIf="message()">{{ message() }}</p><p role="alert" *ngIf="error()">{{ error() }}</p><button [disabled]="busy()">{{ busy() ? "Procesando…" : "Enviar instrucciones" }}</button></form><p><a routerLink="/login">Volver a iniciar sesión</a></p><p><a routerLink="/reset-password">Ya tengo un código</a></p></section>
